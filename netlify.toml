# Netlify Configuration for Static Site

[build]
  # No build command needed - publish files directly
  command = "echo 'Static site - no build needed'"
  publish = "."

[context.production]
  command = "echo 'Static site - no build needed'"

# Redirect rules for SPA navigation with hash routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache headers
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
